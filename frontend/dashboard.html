<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AI Phishing Detection Platform</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #cbd5e1; margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: 20px auto; background: #1e293b; padding: 30px; border-radius: 12px; }
    h2 { text-align: center; color: #38bdf8; margin-top: 0; }
    label { display: block; margin-top: 15px; font-weight: 600; color: #cbd5e1; }
    textarea, input { width: 100%; padding: 12px; margin-top: 6px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0369a1; }
    #result { margin-top: 25px; padding: 20px; border-radius: 8px; background: #334155; display: none; }
    .user-info { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; }
    
    /* Stats Cards Styling */
    .stats-container { display: flex; gap: 15px; margin-bottom: 20px; }
    .stat-card { flex: 1; background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
    .stat-card h3 { margin: 0; font-size: 22px; color: #38bdf8; }
    .stat-card p { margin: 5px 0 0 0; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Strict Authentication Guard -->
  <script>
    const currentUser = JSON.parse(localStorage.getItem('user'));
    if (!currentUser || !currentUser.id) {
      window.location.replace('login.html');
    }
  </script>

  <div class="container">
    <div class="user-info">
      <span id="welcome-msg" style="color: #38bdf8; font-weight: bold;"></span>
      <button onclick="handleLogout()" style="width: auto; margin: 0; padding: 6px 12px; background: #ef4444; font-size: 12px;">Logout</button>
    </div>

    <!-- Stats Summary Cards -->
    <div class="stats-container">
      <div class="stat-card">
        <h3 id="stat-total">0</h3>
        <p>Total Scans</p>
      </div>
      <div class="stat-card">
        <h3 id="stat-safe" style="color: #22c55e;">0</h3>
        <p>Safe Scans</p>
      </div>
      <div class="stat-card">
        <h3 id="stat-risk" style="color: #ef4444;">0</h3>
        <p>Threats Detected</p>
      </div>
    </div>

    <h2>AI-Powered Phishing Detection Platform</h2>
    <label>Enter URL to Scan:</label>
    <input type="text" id="url" placeholder="https://example.com">
    
    <label>Or Enter Email Content:</label>
    <textarea id="emailContent" rows="4" placeholder="Paste suspicious email text here..."></textarea>
    
    <button onclick="scanTarget()">Run AI Threat Analysis</button>
    <div id="result"></div>
  </div>

  <div class="container">
    <h2 style="text-align: center; color: #38bdf8;">Scan History</h2>
    <button onclick="loadHistory()" style="background: #6366f1;">Load My History</button>
    <div id="history-list" style="margin-top: 15px;"></div>
  </div>

  <script>
    window.onload = function() {
      if (currentUser && currentUser.email) {
        document.getElementById('welcome-msg').innerText = `Welcome, ${currentUser.email}!`;
      }
      loadHistory(); 
    };

    function handleLogout() {
      localStorage.removeItem('user');
      window.location.replace('login.html');
    }

    async function scanTarget() {
      const url = document.getElementById('url').value;
      const emailContent = document.getElementById('emailContent').value;
      const resultDiv = document.getElementById('result');

      if (!url && !emailContent) {
        alert("Please enter either a URL or email content to scan.");
        return;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = "Analyzing threat patterns with AI engine...";

      try {
        const userId = currentUser ? currentUser.id : null;

        const response = await fetch('http://127.0.0.1:3000/api/scans/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, emailContent, userId })
        });
        
        const data = await response.json();
        
        if (data.success) {
          resultDiv.innerHTML = `
            <strong>Analysis Report</strong><br>
            Status: ${data.status}<br>
            Risk Score: ${data.riskScore} / 100<br>
            Threat Reasons: ${data.reasons ? data.reasons.join(', ') : 'None'}
          `;
          loadHistory(); 
        } else {
          resultDiv.innerHTML = "Scan failed. Please try again.";
        }
      } catch (error) {
        console.error("Scan error:", error);
        resultDiv.innerHTML = "An error occurred during analysis.";
      }
    }

    async function loadHistory() {
      const historyDiv = document.getElementById('history-list');

      try {
        const response = await fetch(`http://127.0.0.1:3000/api/scans/history/${currentUser.id}`);
        const data = await response.json();
        
        if (data.success && data.scans.length > 0) {
          let total = data.scans.length;
          let safeCount = 0;
          let riskCount = 0;

          let html = '<ul style="list-style-type: none; padding: 0;">';
          data.scans.forEach(scan => {
            const threat = (scan.threat_level || scan.status || '').toLowerCase();

            // Accurate checking for threats vs safe based on actual text
            if (threat.includes('high') || threat.includes('medium') || threat.includes('risk') || threat.includes('phishing')) {
              riskCount++;
            } else {
              safeCount++;
            }

            html += `<li style="background: #0f172a; padding: 12px; margin-bottom: 8px; border-radius: 8px;">
                      <strong>Target:</strong> ${scan.target_url || scan.url || 'N/A'}<br>
                      <strong>Threat Level:</strong> ${scan.threat_level || scan.status || 'Safe'}<br>
                      <small style="color: #94a3b8;">${new Date(scan.created_at).toLocaleString()}</small>
                    </li>`;
          });
          html += '</ul>';
          historyDiv.innerHTML = html;

          document.getElementById('stat-total').innerText = total;
          document.getElementById('stat-safe').innerText = safeCount;
          document.getElementById('stat-risk').innerText = riskCount;

        } else {
          historyDiv.innerHTML = '<p>No scan history found.</p>';
          document.getElementById('stat-total').innerText = 0;
          document.getElementById('stat-safe').innerText = 0;
          document.getElementById('stat-risk').innerText = 0;
        }
      } catch (error) {
        console.error("Error loading history:", error);
        historyDiv.innerHTML = '<p style="color: #ef4444;">Failed to load history.</p>';
      }
    }
  </script>
</body>
</html>
